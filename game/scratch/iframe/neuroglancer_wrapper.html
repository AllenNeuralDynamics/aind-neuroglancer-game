<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
  <div>
    <button onclick="getIframeUrl()">Get Iframe URL</button>
    <button onclick="setIframeUrl('http:\/\/tinyurl.com/2td3vbmc')">Set Iframe URL</button>
    <iframe id="neuroglancer-pane" src="http://localhost:8081" style="height:1000px; width:100%; border:none;"></iframe>
  </div>
  <script>
    // window.onload = function () {
    // }
    function setIframeUrl(url) {
      // get the iframe element
      var iframe = document.getElementById('neuroglancer-pane');
      // set the new URL as the src attribute of the iframe
      iframe.src = url;
    }
    function getIframeUrl() {
      // get the iframe element
      var iframe = document.getElementById('neuroglancer-pane');
      // return the current URL of the iframe
      console.log(iframe);
      // console.log(iframe.src);
      // print the child #document
      console.log(iframe.contentDocument);
      console.log(iframe.contentWindow.document);
      console.log(iframe.contenntWindow.location.href);
      return iframe;
    }
  </script>
</body>

</html>
